# Explicit local-inference overlay. The default docker-compose.yaml never starts Ollama.
# docker compose -f docker-compose.yaml -f compose.ollama.yaml up -d
services:
  backend:
    environment:
      AI_ENABLED: "true"
      AI_PROVIDER: ollama
      AI_URL: http://ollama:11434
      AI_API_KEY: ""
      AI_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      AI_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_started
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
volumes:
  ollama_data:
