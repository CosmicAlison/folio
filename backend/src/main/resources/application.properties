spring.application.name=folio
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:folio}}
spring.datasource.username=${DATABASE_USER:folio}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=86400000
ai.enabled=${AI_ENABLED:false}
ai.provider=${AI_PROVIDER:hosted}
ai.url=${AI_URL:https://openrouter.ai/api/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:google/gemini-2.5-flash-lite}
ai.embedding-model=${AI_EMBEDDING_MODEL:openai/text-embedding-3-small}
