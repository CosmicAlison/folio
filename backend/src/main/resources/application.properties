spring.application.name=folio
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/folio}
spring.datasource.username=${DATABASE_USER:folio}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=86400000
ai.enabled=${AI_ENABLED:false}
ai.url=${AI_URL:http://localhost:11434}
ai.model=${AI_MODEL:gemma3:1b}
ai.embedding-model=${AI_EMBEDDING_MODEL:embeddinggemma}
