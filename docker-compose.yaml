name: folio
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: folio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/folio
      DATABASE_USER: folio
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64-encoded JWT_SECRET in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-gemma3:1b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embeddinggemma}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
volumes:
  postgres_data:
  ollama_data:
