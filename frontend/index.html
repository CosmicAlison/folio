<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("folio-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta
      name="description"
      content="Your private blog workspace, with source-grounded answers from your own writing."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio | Blog workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
